name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, Clippy, Fmt, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The crate depends on ulb-lang via a sibling path dependency
      # (`../Uliab/crates/ulb-lang`). Uliab is public, so a plain checkout
      # of its default branch is enough — always lint/test against current
      # Uliab main to catch drift immediately.
      - name: Checkout Uliab sibling
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          ref: main
          path: uliab-sibling

      - name: Expose the sibling at the expected path
        run: ln -s "$GITHUB_WORKSPACE/uliab-sibling" "$(dirname "$GITHUB_WORKSPACE")/Uliab"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build all targets
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run doc tests
        run: cargo test --workspace --doc
